name: Fork Sync + Deploy

permissions:
    contents: write

on:
    schedule:
        - cron: "23 18 * * *"  # 每天 02:23（北京）同步上游
    workflow_dispatch:

concurrency:
    group: fork-sync-deploy
    cancel-in-progress: false

jobs:
    sync_and_deploy:
        name: Sync upstream, verify, then deploy
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            # Account ID 不是密钥，可用仓库变量覆盖
            CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || 'd14679d2b5b531363046bfd538abc363' }}
        steps:
            - name: Checkout target repo
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Sync code from upstream
              run: |
                  set -e
                  git config user.name  "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git remote add upstream https://github.com/huangxd-/danmu_api.git || true
                  git fetch upstream main
                  # 代码全部跟随上游，不再冻结 worker.js / dandan-api.js。
                  # 只保护本 fork 的文档、AI 约定文件和本 workflow 自身。
                  git checkout upstream/main -- . \
                      ':(exclude).github/workflows' \
                      ':(exclude)docs' \
                      ':(exclude)AGENTS.md' \
                      ':(exclude)CLAUDE.md' \
                      ':(exclude).gitignore'
                  echo "已同步上游，变更文件："
                  git diff --cached --name-only | head -50

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"

            - name: Install dependencies
              run: npm install --no-audit --no-fund

            - name: Install wrangler
              run: npm install -g wrangler@4

            - name: Run tests
              run: npm test

            - name: Verify Worker build
              run: npx wrangler deploy --dry-run

            - name: Commit and push sync
              run: |
                  set -e
                  if git diff --cached --quiet; then
                      echo "上游无新变更，跳过提交"
                  else
                      git commit -m "chore(sync): 同步上游 huangxd-/danmu_api 最新代码"
                      git push origin main
                      echo "同步完成"
                  fi

            - name: Deploy to Cloudflare Workers
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
              run: |
                  set -e
                  if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
                      echo "::error::CLOUDFLARE_API_TOKEN 未配置，停止部署"
                      exit 1
                  fi
                  npx wrangler deploy
                  echo "部署完成"
