name: Configure Upstash Secrets

permissions:
    contents: read

on:
    workflow_dispatch:

jobs:
    configure:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        env:
            CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || 'd14679d2b5b531363046bfd538abc363' }}
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            UPSTASH_REDIS_REST_URL: ${{ secrets.TEMP_UPSTASH_REDIS_REST_URL }}
            UPSTASH_REDIS_REST_TOKEN: ${{ secrets.TEMP_UPSTASH_REDIS_REST_TOKEN }}
        steps:
            - name: Write Worker secrets
              run: |
                  set -euo pipefail
                  for name in UPSTASH_REDIS_REST_URL UPSTASH_REDIS_REST_TOKEN; do
                      value="${!name}"
                      test -n "$value"
                      payload=$(jq -cn --arg name "$name" --arg text "$value" '{name:$name,text:$text,type:"secret_text"}')
                      response=$(curl --fail-with-body -sS -X PUT \
                          "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/danmu-api/secrets" \
                          -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                          -H "Content-Type: application/json" \
                          --data "$payload")
                      echo "$response" | jq -e '.success == true' >/dev/null
                      echo "configured ${name}"
                  done
